<ion-header class="ion-no-border">

  <ion-toolbar>

    <div class="brand">

      <div class="brand-crown">
        ♛
      </div>

      <div class="brand-title">
        MEMORIZA
      </div>

      <div class="brand-stars">
        <span>✦</span>
        <span>✦</span>
      </div>

      <div class="brand-line"></div>

      <div class="brand-shield">
        M
      </div>

    </div>

  </ion-toolbar>

</ion-header>


<ion-content class="game-content">

  <div class="game-wrapper">


    <!-- =========================
         MARCADOR
         ========================= -->

    <div class="scoreboard">

      <div class="score-slot">

        <span class="score-label">
          PARES
        </span>

        <span class="score-value">

          {{ matches }}

          <small>
            / {{ pairs }}
          </small>

        </span>

      </div>


      <div class="score-divider"></div>


      <div class="score-slot">

        <span class="score-label">
          INTENTOS
        </span>

        <span class="score-value">
          {{ attempts }}
        </span>

      </div>


      <div class="score-divider"></div>


      <div class="score-slot">

        <span class="score-label">
          MEJOR
        </span>

        <span class="score-value">
          {{ bestAtems > 0 ? bestAtems : '—' }}
        </span>

      </div>


      <button
        class="restart-btn"
        type="button"
        aria-label="Nueva partida"
        (click)="newGame()"
      >

        <span class="restart-icon">
          ↻
        </span>

      </button>

    </div>


    <!-- =========================
         MENSAJE FINAL
         ========================= -->

    <div
      class="message"
      *ngIf="finished"
      [class.new-record]="isNewRecord"
    >

      <span *ngIf="isNewRecord">

        🏆 NUEVO RÉCORD
        · {{ attempts }} INTENTOS

      </span>


      <span *ngIf="!isNewRecord">

        ✦ ÁLBUM COMPLETO
        · {{ attempts }} INTENTOS

      </span>

    </div>


    <!-- =========================
         TABLERO 4 X 4
         ========================= -->

    <div class="board">

      <button
        type="button"
        class="card"

        *ngFor="let c of cards"

        [ngClass]="{
          'revealed': c.revealed || c.matched,
          'matched': c.matched
        }"

        [disabled]="boardLocked || c.matched"

        (click)="onCardClick(c)"
      >


        <!-- =========================
             REVERSO DE LA CARTA
             ========================= -->

        <div class="face back">

          <div class="card-metal-line top"></div>


          <div class="back-decoration left"></div>

          <div class="back-decoration right"></div>


          <div class="back-stars">
            ✦
          </div>


          <!-- ESCUDO -->

          <div class="crest-panel">

            <div class="crest-frame">

              <div class="crest-star">
                ★
              </div>

              <div class="crest-text">
                MFC
              </div>

              <img
                class="crest-icon"
                src="assets/imagenes/escudo.png"
                alt="Millonarios FC"
              >

            </div>

          </div>


          <!-- LINEAS -->

          <div class="back-lines">

            <span></span>

            <span></span>

            <span></span>

          </div>


          <!-- TEXTO -->

          <div class="back-bottom">
            MILLONARIOS
          </div>


          <div class="card-shine-back"></div>

        </div>


        <!-- =========================
             FRENTE DE LA CARTA
             ========================= -->

        <div class="face front">

          <div class="front-frame"></div>

          <div class="corner-ornament tl"></div>
          <div class="corner-ornament tr"></div>
          <div class="corner-ornament bl"></div>
          <div class="corner-ornament br"></div>


          <!-- CINTA LEYENDA -->

          <div class="legend-ribbon">

            <span class="ribbon-crown">
              ♛
            </span>

            <span class="ribbon-text">
              LEYENDA
            </span>

          </div>


          <!-- FOTO -->

          <div class="player-photo-wrap">

            <div class="photo-frame">

              <img
                class="player-img"

                [src]="c.image"

                alt="Jugador de Millonarios FC"
              >

            </div>

          </div>


          <!-- PLACA INFERIOR -->

          <div class="legend-plaque">

            <div class="plaque-name">
              MILLONARIOS FC
            </div>

            <div class="plaque-crest-row">

              <span class="laurel laurel-left"></span>

              <div class="plaque-crest">

                <img
                  src="assets/imagenes/escudo.png"

                  alt="Millonarios FC"
                >

              </div>

              <span class="laurel laurel-right"></span>

            </div>

          </div>


          <div class="card-shine"></div>

        </div>

      </button>

    </div>


    <!-- =========================
         FOOTER
         ========================= -->

    <div class="collection-footer">

      <div class="footer-line left"></div>

      <span class="footer-star">
        ★
      </span>

      <img
        src="assets/imagenes/escudo.png"
        alt="Millonarios FC"
        class="footer-crest"
      >

      <span class="footer-name">
        MILLONARIOS FC
      </span>

      <span class="footer-star">
        ★
      </span>

      <div class="footer-line right"></div>

    </div>


  </div>

</ion-content>
